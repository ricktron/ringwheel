name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check and production build
        run: npm run build

      - name: Unit and contract tests
        run: npm test

      - name: Install browser for the smoke test
        run: npx playwright install --with-deps chromium

      # Runs against a local fake backend with synthetic data. No secrets are needed or used.
      - name: Browser smoke test
        run: npm run test:e2e
